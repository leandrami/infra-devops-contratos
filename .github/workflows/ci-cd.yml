name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-scan:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Build & Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Análise estática do código
        run: semgrep scan --config auto src

  iac-scan:
    name: Scan de IaC (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,dockerfile,kubernetes
          quiet: true
          soft_fail: true

  docker:
    name: Build, scan (Trivy) e push (Docker Hub)
    needs: [test, secrets-scan, sast, iac-scan]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Definir nome da imagem
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "IMAGE_NAME=$(echo "${DOCKERHUB_USERNAME:-local}/${REPO}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Login no Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (e push apenas fora de PR e com secrets configurados)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
          load: ${{ !(env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request') }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "0"

  dast:
    name: DAST (OWASP ZAP)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir a API com Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build api
      - name: Aguardar a API ficar saudável
        run: curl -sf --retry 30 --retry-delay 3 --retry-connrefused http://localhost:3000/health
      - name: Ataque simulado (ZAP baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:3000
          fail_action: false
          allow_issue_writing: false
      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform + LocalStack
    needs: test
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,sts
    steps:
      - uses: actions/checkout@v4
      - name: Aguardar o LocalStack
        run: curl -sf --retry 30 --retry-delay 2 --retry-connrefused http://localhost:4566/_localstack/health
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init e validate
        working-directory: terraform
        run: |
          terraform init
          terraform validate
      - name: Terraform apply (AWS simulada)
        working-directory: terraform
        run: terraform apply -auto-approve
