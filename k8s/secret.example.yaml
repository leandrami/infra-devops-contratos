# NÃO versionar o secret real. Crie com:
#   kubectl -n contratos create secret generic contratos-secret \
#     --from-literal=DB_USER=contracts --from-literal=DB_PASSWORD='senha-forte'
apiVersion: v1
kind: Secret
metadata:
  name: contratos-secret
  namespace: contratos
type: Opaque
stringData:
  DB_USER: contracts
  DB_PASSWORD: troque_esta_senha
