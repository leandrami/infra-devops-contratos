apiVersion: apps/v1
kind: Deployment
metadata:
  name: contratos-api
  namespace: contratos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: contratos-api }
  template:
    metadata:
      labels: { app: contratos-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z redis 6379; do echo aguardando dependencias; sleep 2; done"]
      containers:
        - name: api
          # Troque pelo seu repositório (ghcr.io/<usuario>/<repo>)
          image: ghcr.io/SEU_USUARIO/infra-devops-contratos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: contratos-config }
            - secretRef: { name: contratos-secret }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: contratos-api
  namespace: contratos
spec:
  selector: { app: contratos-api }
  ports:
    - port: 80
      targetPort: 3000
